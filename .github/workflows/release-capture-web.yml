name: Release capture-web

# One path to a release, and it starts with a merge to `main`.
#
# Both halves are switched off by one variable of the `production`
# environment, `SDK_PUBLISH`, so until the operator sets it and the npm
# credential beside it, a merge to `main` produces nothing here at all — no
# pull request, no branch, no tag.
# The switch-on sequence is in docs/build/operator-gates.md.
#
# release-please reads the conventional commits that touched
# `packages/capture-web` and keeps a pull request open with the next version
# and the changelog entry it would write. Merging that pull request is the
# decision to release: it bumps the version, writes CHANGELOG.md, and tags
# `capture-web@<version>`. Nothing else creates that tag, because a second way
# to publish is a way for the manifest and npm to disagree.
#
# The publish half then runs against that same commit. One tag, one immutable
# version, no alias anywhere: not an npm `latest` dist-tag, not a `v/latest/`
# path on the CDN. A published version is never overwritten.
#
# The CDN goes first and npm last, and the order is the whole design. Both
# sides are immutable, so a run that completes one and fails the other cannot
# be undone, only finished — and only one of the two failures can be finished.
# A CDN path with no version on npm is invisible: nothing resolves it, and
# re-running this job repairs it, because an object already carrying these
# exact bytes is not an error. A version on npm whose script tag answers 404
# is already in somebody else's page, and no re-run takes it back.
#
# `workflow_dispatch` publishes whatever version the package currently declares,
# for the one case the merge path cannot cover: a version that was tagged while
# publishing was off. It cannot invent a version — the manifest still decides
# that — and it refuses a version already on npm or on the CDN.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-capture-web
  cancel-in-progress: false

jobs:
  # `SDK_PUBLISH` gates this half too, and not only the publish below: a
  # release pull request nobody can complete is worse than none. Closed, it
  # comes back on the next push — #29 was closed and returned as #36 — so it
  # accumulates as noise on a branch that is supposed to be quiet, and merging
  # it would tag a version that publishing is switched off for.
  #
  # Nothing is lost by waiting. release-please keeps no state of its own: it
  # derives the next version and the changelog from git, back to
  # `bootstrap-sha`, so the first run after the switch is thrown covers
  # everything accumulated in one pull request.
  version:
    if: github.event_name == 'push' && vars.SDK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # `SDK_PUBLISH` is a variable of this environment and not of the
    # repository, so a job that does not name the environment reads nothing
    # for it. Without this line the gate above would close on an empty string
    # and keep closing: setting the variable would switch `publish` on and
    # leave `version` off, which is a release path that can never open a pull
    # request. The environment's only rule is a branch policy naming `main` —
    # no reviewer, no wait — and this workflow runs nowhere else.
    environment: production
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Like the deploy jobs, this skips rather than fails until the operator sets
  # `SDK_PUBLISH`. A release that tagged and then failed to publish is the one
  # state worth designing against: the version would exist in the repository
  # and nowhere a customer can reach.
  publish:
    needs: version
    if: >-
      always() && vars.SDK_PUBLISH == 'true'
      && (needs.version.outputs.released == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      # OIDC: the same role the deploy assumes, which this environment already
      # trusts. Four long-lived keys were the alternative.
      id-token: write
      contents: read
    env:
      CDN_BUCKET: ${{ vars.SDK_BUCKET }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The version is read from the package rather than from the tag: this run
      # is the merge release-please tagged, so the file is the release.
      - name: Read the released version
        id: release
        run: |
          version=$(node -p "require('./packages/capture-web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing capture-web $version"

      # npm is the half that cannot be taken back, so a version already there
      # ends the run before anything is built. The CDN is not asked here: what
      # it holds only matters once there are bytes to compare it against, and
      # that is the upload step's own question.
      #
      # `head-bucket` is not a safety check — the order below is what makes
      # this job safe — it is the difference between failing in five seconds
      # and failing after a full build. It needs `s3:ListBucket`, which is
      # also what makes a 404 from the upload step honest: without it S3
      # answers a missing key with 403.
      - name: Refuse to release a version that is already on npm
        run: |
          version="${{ steps.release.outputs.version }}"
          if npm view "@tracelog/capture-web@$version" version >/dev/null 2>&1; then
            echo "@tracelog/capture-web@$version is already published." >&2
            exit 1
          fi
          aws s3api head-bucket --bucket "$CDN_BUCKET"

      # Scoped to what can reach the tarball, not to the whole tree. CI runs
      # every gate over this same commit on the push that release-please's
      # merge produced; repeating three Next builds and the platform's test
      # suite here proves nothing new about 12 KB of browser runtime, and it
      # lets an unrelated red build hold a release the SDK is ready for.
      #
      # What is left is everything that *can* change the published bytes:
      # `lint`, because the SDK boundary rules live there and a platform
      # import in `capture-core` would ship server code to customer sites;
      # the root suite, because `tools/sdk-package.test.ts` opens the tarball
      # and uses it the way a stranger does; and the package's own graph —
      # config, event-contract and capture-core are inlined into the bundle,
      # so their tests are tests of what is published.
      #
      # `tokens:check` is not here: the design tokens are `packages/ui`, which
      # this artifact never touches.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vitest run --config vitest.config.ts
      - run: pnpm --filter @tracelog/capture-web... typecheck
      - run: pnpm --filter @tracelog/capture-web... test
      - run: pnpm --filter @tracelog/capture-web... build

      # An object already at this key is not automatically a refusal, because
      # this step running twice is how the run before it gets finished. It is
      # a refusal when the bytes differ: one version, two runtimes, on the one
      # path a customer pinned and cannot re-point. The comparison is honest
      # because the build is reproducible — the bundle is a concatenation of
      # already-emitted files with no clock in it — and because 21 KB is one
      # part, so S3's ETag is the file's MD5 rather than a digest of digests.
      - name: Upload the immutable CDN path
        run: |
          version="${{ steps.release.outputs.version }}"
          key="v/$version/tracelog.js"
          file=packages/capture-web/dist/tracelog.iife.js

          if etag=$(aws s3api head-object --bucket "$CDN_BUCKET" --key "$key" \
              --query ETag --output text 2>&1); then
            present=yes
          else
            case "$etag" in
              *404*|*"Not Found"*) present=no ;;
              *)
                echo "$etag" >&2
                echo "The CDN could not be read, so whether $key is there is unknown." >&2
                exit 1 ;;
            esac
          fi

          if [ "$present" = no ]; then
            aws s3 cp "$file" "s3://$CDN_BUCKET/$key" \
              --content-type application/javascript \
              --cache-control "public, max-age=31536000, immutable"
            echo "Uploaded cdn.tracelog.io/$key"
            exit 0
          fi

          etag=${etag//\"/}
          case "$etag" in
            *-*)
              echo "cdn.tracelog.io/$key was uploaded in parts, so its ETag is a digest of digests and not this file's checksum. Compare it by hand." >&2
              exit 1 ;;
          esac

          if [ "$etag" != "$(md5sum "$file" | cut -d' ' -f1)" ]; then
            echo "cdn.tracelog.io/$key exists and is not these bytes. One version cannot be two runtimes; release the next version instead." >&2
            exit 1
          fi
          echo "cdn.tracelog.io/$key is already these exact bytes, left as it is."

      # A precondition, so it runs before the publish and not after it: a
      # `latest` dist-tag lets a consumer resolve a version without naming
      # one, and found afterwards it would already be answering
      # `npm install @tracelog/capture-web` while the job could only report
      # it. What this proves is that no earlier run left an alias behind. It
      # cannot prove what the registry does on the package's very first
      # publish — npm may set `latest` itself when the first version of a
      # package arrives, `--tag` or not — which is why the publish step below
      # prints the dist-tags it ends with. On the first publish, read them:
      # if `latest` is there, `npm dist-tag rm @tracelog/capture-web latest`
      # by hand, and record what the registry answered in
      # docs/build/operator-gates.md § The SDK release path.
      #
      # A 404 is a package that does not exist yet, which has no tags; any
      # other failure is a question this step cannot answer, and it stops.
      - name: Refuse to publish beside a latest dist-tag
        run: |
          if tags=$(npm dist-tag ls @tracelog/capture-web 2>&1); then
            :
          else
            case "$tags" in
              *E404*|*"404"*) tags="" ;;
              *)
                echo "$tags" >&2
                echo "The registry could not be read, so whether a latest dist-tag exists is unknown." >&2
                exit 1 ;;
            esac
          fi
          if printf '%s\n' "$tags" | grep -q '^latest:'; then
            echo "A latest dist-tag exists; every consumer must pin a version." >&2
            exit 1
          fi

      # Last, because this is the half no re-run can take back. Everything
      # above can be repeated; a version on npm cannot be withdrawn.
      - name: Publish the pinned version to npm
        run: |
          version="${{ steps.release.outputs.version }}"
          pnpm --filter @tracelog/capture-web publish \
            --no-git-checks --access public --tag "release-$version"
          echo "dist-tags after publishing $version:"
          npm dist-tag ls @tracelog/capture-web
