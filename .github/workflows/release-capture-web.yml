name: Release capture-web

# One path to a release, and it starts with a merge to `main`.
#
# Both halves are switched off by one repository variable, `SDK_PUBLISH`, so
# until the operator sets it and the npm credential beside it, a merge to
# `main` produces nothing here at all — no pull request, no branch, no tag.
# The switch-on sequence is in docs/build/state.md § Operator gates.
#
# release-please reads the conventional commits that touched
# `packages/capture-web` and keeps a pull request open with the next version
# and the changelog entry it would write. Merging that pull request is the
# decision to release: it bumps the version, writes CHANGELOG.md, and tags
# `capture-web@<version>`. Nothing else creates that tag, because a second way
# to publish is a way for the manifest and npm to disagree.
#
# The publish half then runs against that same commit. One tag, one immutable
# version, no alias anywhere: not an npm `latest` dist-tag, not a `v/latest/`
# path on the CDN. A published version is never overwritten — the job refuses
# before it uploads.
#
# `workflow_dispatch` publishes whatever version the package currently declares,
# for the one case the merge path cannot cover: a version that was tagged while
# publishing was off. It cannot invent a version — the manifest still decides
# that — and it refuses a version already on npm or on the CDN.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-capture-web
  cancel-in-progress: false

jobs:
  # `SDK_PUBLISH` gates this half too, and not only the publish below: a
  # release pull request nobody can complete is worse than none. Closed, it
  # comes back on the next push — #29 was closed and returned as #36 — so it
  # accumulates as noise on a branch that is supposed to be quiet, and merging
  # it would tag a version that publishing is switched off for.
  #
  # Nothing is lost by waiting. release-please keeps no state of its own: it
  # derives the next version and the changelog from git, back to
  # `bootstrap-sha`, so the first run after the switch is thrown covers
  # everything accumulated in one pull request.
  version:
    if: github.event_name == 'push' && vars.SDK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Like the deploy jobs, this skips rather than fails until the operator sets
  # `SDK_PUBLISH`. A release that tagged and then failed to publish is the one
  # state worth designing against: the version would exist in the repository
  # and nowhere a customer can reach.
  publish:
    needs: version
    if: >-
      always() && vars.SDK_PUBLISH == 'true'
      && (needs.version.outputs.released == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      # OIDC: the same role the deploy assumes, which this environment already
      # trusts. Four long-lived keys were the alternative.
      id-token: write
      contents: read
    env:
      CDN_BUCKET: ${{ vars.SDK_BUCKET }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The version is read from the package rather than from the tag: this run
      # is the merge release-please tagged, so the file is the release.
      - name: Read the released version
        id: release
        run: |
          version=$(node -p "require('./packages/capture-web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing capture-web $version"

      - name: Refuse to overwrite a published version
        run: |
          version="${{ steps.release.outputs.version }}"
          if npm view "@tracelog/capture-web@$version" version >/dev/null 2>&1; then
            echo "@tracelog/capture-web@$version is already published." >&2
            exit 1
          fi
          if aws s3api head-object --bucket "$CDN_BUCKET" --key "v/$version/tracelog.js" >/dev/null 2>&1; then
            echo "cdn.tracelog.io/v/$version/tracelog.js already exists." >&2
            exit 1
          fi

      # Scoped to what can reach the tarball, not to the whole tree. CI runs
      # every gate over this same commit on the push that release-please's
      # merge produced; repeating three Next builds and the platform's test
      # suite here proves nothing new about 12 KB of browser runtime, and it
      # lets an unrelated red build hold a release the SDK is ready for.
      #
      # What is left is everything that *can* change the published bytes:
      # `lint`, because the SDK boundary rules live there and a platform
      # import in `capture-core` would ship server code to customer sites;
      # the root suite, because `tools/sdk-package.test.ts` opens the tarball
      # and uses it the way a stranger does; and the package's own graph —
      # config, event-contract and capture-core are inlined into the bundle,
      # so their tests are tests of what is published.
      #
      # `tokens:check` is not here: the design tokens are `packages/ui`, which
      # this artifact never touches.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec vitest run --config vitest.config.ts
      - run: pnpm --filter @tracelog/capture-web... typecheck
      - run: pnpm --filter @tracelog/capture-web... test
      - run: pnpm --filter @tracelog/capture-web... build

      - name: Publish the pinned version to npm
        run: |
          version="${{ steps.release.outputs.version }}"
          pnpm --filter @tracelog/capture-web publish \
            --no-git-checks --access public --tag "release-$version"
          if npm dist-tag ls @tracelog/capture-web | grep -q '^latest:'; then
            echo "A latest dist-tag exists; every consumer must pin a version." >&2
            exit 1
          fi

      - name: Upload the immutable CDN path
        run: |
          version="${{ steps.release.outputs.version }}"
          aws s3 cp packages/capture-web/dist/tracelog.iife.js \
            "s3://$CDN_BUCKET/v/$version/tracelog.js" \
            --content-type application/javascript \
            --cache-control "public, max-age=31536000, immutable"
